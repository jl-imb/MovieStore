{% extends 'base.html' %}
{% load static %}
{% block content %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
    <header class="masthead bg-index text-white text-center py-4">
    <style>
    .wrapper {
      border: none;
      width: 90%;
      max-width: 1700px;
      margin-inline: auto;
      position: relative;
      height: 220px;
      margin-top: 4rem;
      overflow: hidden;
      mask-image: linear-gradient(
        to right,
        rgba(0,0,0,0),
        rgba(0,0,0,1) 20%,
        rgba(0,0,0,1) 80%,
        rgba(0,0,0,0)
      );
    }
    @keyframes scrollLeft {
        to {
            left: -200px;
        }
    }
    .item {
      width: 160px;
      height: 220px;
      border-radius: 4px;
      position: absolute;
      left: max(calc(160px * 16), 100%);
      animation-name: scrollLeft;
      animation-duration: 20s;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      background-size: cover;
      background-position: center;
    }

    .item1 {
        animation-delay: calc(20s/ 16 * (16 - 1) * -1);
        background-image: url('/media/movie_images/avatar.jpg');
    }
    .item2 {
        animation-delay: calc(20s/ 16 * (16 - 2) * -1);
        background-image: url('/media/movie_images/madagascar.jpg');
    }
    .item3 {
        animation-delay: calc(20s/ 16 * (16 - 3) * -1);
        background-image: url('/media/movie_images/titanic.jpg');
    }
    .item4 {
        animation-delay: calc(20s/ 16 * (16 - 4) * -1);
        background-image: url('/media/movie_images/darkknight.jpg');
    }
    .item5 {
        animation-delay: calc(20s/ 16 * (16 - 5) * -1);
        background-image: url('/media/movie_images/endgame.jpg');
    }
    .item6 {
        animation-delay: calc(20s/ 16 * (16 - 6) * -1);
        background-image: url('/media/movie_images/inception.jpg');
    }
    .item7 {
        animation-delay: calc(20s/ 16 * (16 - 7) * -1);
        background-image: url('/media/movie_images/lionking.jpg');
    }
    .item8 {
        animation-delay: calc(20s/ 16 * (16 - 8) * -1);
        background-image: url('/media/movie_images/lionkinghalf.jpg');
    }
    .item9 {
        animation-delay: calc(20s/ 16 * (16 - 9) * -1);
        background-image: url('/media/movie_images/greatestshowman.jpg');
    }
    .item10 {
        animation-delay: calc(20s/ 16 * (16 - 10) * -1);
        background-image: url('/media/movie_images/wicked.jpg');
    }
    .item11 {
        animation-delay: calc(20s/ 16 * (16 - 11) * -1);
        background-image: url('/media/movie_images/hungergames.jpg');
    }
    .item12 {
        animation-delay: calc(20s/ 16 * (16 - 12) * -1);
        background-image: url('/media/movie_images/notebook.jpg');
    }
    .item13 {
        animation-delay: calc(20s/ 16 * (16 - 13) * -1);
        background-image: url('/media/movie_images/harrypotter.jpg');
    }
    .item14 {
        animation-delay: calc(20s/ 16 * (16 - 14) * -1);
        background-image: url('/media/movie_images/barbie.jpg');
    }
    .item15 {
        animation-delay: calc(20s/ 16 * (16 - 15) * -1);
        background-image: url('/media/movie_images/infinitywar.jpg');
    }
    .item16 {
        animation-delay: calc(20s/ 16 * (16 - 16) * -1);
        background-image: url('/media/movie_images/tangled.jpg');
    }
  </style>

        <div class="container d-flex align-items-center flex-column pt-2">
        <h2>Movies Store</h2>
        <p>Your Ticket to Unlimited Entertainment!</p>
      </div>
    </header>
    <div class="p-3">
      <div class="container">
        <div class="row mt-3">
          <div class="col mx-auto text-center mb-3">
            <h4>Welcome to the best movie store!!</h4>
              <div class="wrapper">
                <div class="item item1"></div>
                <div class="item item2"></div>
                <div class="item item3"></div>
                <div class="item item4"></div>
                <div class="item item5"></div>
                <div class="item item6"></div>
                <div class="item item7"></div>
                <div class="item item8"></div>
                <div class="item item9"></div>
                <div class="item item10"></div>
                <div class="item item11"></div>
                <div class="item item12"></div>
                <div class="item item13"></div>
                <div class="item item14"></div>
                <div class="item item15"></div>
                <div class="item item16"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

{% endblock content %}
